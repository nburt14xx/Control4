name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  driver:
    name: Control4 driver (.c4z)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.1
      - name: Run driver tests
        run: lua5.1 control4/test/test_driver.lua
      - name: Package c4z
        run: python3 control4/tools/build_c4z.py --out dist/shield_bridge.c4z
      - uses: actions/upload-artifact@v4
        with:
          name: shield_bridge-c4z
          path: dist/shield_bridge.c4z

  app:
    name: Shield Bridge app (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: shield-bridge
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      # The APK is signed with the fixed key committed at
      # shield-bridge/app/shieldbridge-debug.jks, so the certificate printed
      # here must be the same on every run. That is what lets a newer build
      # install over an older one with `adb install -r`.
      - name: Print signing certificate
        working-directory: shield-bridge
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs \
            app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: shield-bridge-apk
          path: shield-bridge/app/build/outputs/apk/debug/app-debug.apk

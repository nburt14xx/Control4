name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  driver:
    name: Control4 driver (.c4z)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.1
      - name: Run driver tests
        run: |
          lua5.1 control4/test/test_driver.lua
          lua5.1 control4/test/test_search.lua
      - name: Package c4z
        run: python3 control4/tools/build_c4z.py --out dist/shield_bridge.c4z
      - uses: actions/upload-artifact@v4
        with:
          name: shield_bridge-c4z
          path: dist/shield_bridge.c4z

  app:
    name: Shield Bridge app (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: shield-bridge
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: shield-bridge-apk
          path: shield-bridge/app/build/outputs/apk/debug/app-debug.apk

  release:
    name: Publish downloadable build
    needs: [driver, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: shield_bridge-c4z
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: shield-bridge-apk
          path: out
      - name: Rename for the release page
        run: |
          mv out/app-debug.apk out/shield-bridge.apk
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }} (${{ github.ref_name }})
          prerelease: true
          body: |
            Automated build of commit ${{ github.sha }} on `${{ github.ref_name }}`.

            - `shield-bridge.apk`: sideload on the NVIDIA Shield (`adb install -r shield-bridge.apk`)
            - `shield_bridge.c4z`: add in Composer Pro via Driver > Add or Update Driver or Agent
          files: |
            out/shield-bridge.apk
            out/shield_bridge.c4z
